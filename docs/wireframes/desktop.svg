="940" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#65756a" >Pause control + reduced-motion support; never block the</text><text x="533" y="960" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#65756a" >prompt.</text><text x="966" y="913" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#52685a" >3–4</text><text x="1003" y="913" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2d3d32" >Useful navigation, honest states</text><text x="1003" y="940" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#65756a" >Keep existing service routes. Do not simulate</text><text x="1003" y="960" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#65756a" >a live AI answer.</text></svg>