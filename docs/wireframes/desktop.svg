ibia.</text><rect x="309" y="393" width="590" height="145" rx="15" fill="#fff" stroke="#7f9486" stroke-width="2"/><text x="331" y="427" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#738379" >Ask a question or tell me what you need…</text><text x="331" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#8b978e" >Example: Where can I find farming support?</text><g transform="translate(332,494) scale(0.875)" stroke="#505c5f" fill="none" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3v18M3 12h18"/></g><g transform="translate(799,491) scale(0.9166666666666666)" stroke="#505c5f" fill="none" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v4m-4 0h8"/></g><rect x="841" y="482" width="42" height="42" rx="12" fill="#52685a" stroke="none" /><g transform="translate(850,491) scale(1.0)" stroke="#fff" fill="none" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"><path d="m5 12 14 0m-6-6 6 6-6 6"/></g><circle cx="895" cy="393" r="12" fill="#283235" stroke="none"/><text x="895" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="311" y="564" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#63736a" >AI connection pending · service search is available</text><circle cx="883" cy="559" r="12" fill="#283235" stroke="none"/><text x="883" y="563" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="311" y="614" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#627469" >OR EXPLORE</text><rect x="309" y="632" width="188" height="52" rx="11" fill="#f6f7f5" stroke="#d2d9d3" /><g transform="translate(321,648) scale(0.75)" stroke="#505c5f" fill="non