<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">OneNam companion — desktop wireframe</title><desc id="desc">Desktop landing page with a left navigation rail, first-screen prompt and animated companion artwork region. Includes numbered implementation notes.</desc><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#f1f3f2" stroke="none" /><text x="24" y="37" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#52605b" >ONENAM  /  COMPANION FIRST</text><text x="24" y="70" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#202a26" >Desktop web app · landing state</text><text x="1416" y="67" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#62706a" text-anchor="end">1440 px concept · 18 November 2026</text><rect x="24" y="98" width="1392" height="770" rx="16" fill="#fff" stroke="#9da9a3" /><rect x="24" y="98" width="220" height="770" rx="16" fill="#edf0ed" stroke="none" /><line x1="244" y1="98" x2="244" y2="868" stroke="#c8cecd" /><text x="52" y="145" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#29342e" >OneNam</text><text x="52" y="168" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#62706a" >Your companion for Namibia</text><rect x="43" y="199" width="182" height="43" rx="9" fill="#fff" stroke="#c3cbc6" /><g transform="translate(56,210) scale(0.8333333333333334)" stroke="#505c5f" fill="none" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3v18M3 12h18"/></g><text x="84" y="226" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28362e" >New conversation</text><rect x="40" y="251" width="188" height="42" rx="8" fill="#d6dfd7" stroke="none" /><g transform="translate(55,261) scale(0.8333333333333334)" stroke="#505c5f" fill="none" stroke-w