name: Portal quality and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Design and browser gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
      - name: Install documentation dependencies
        working-directory: docs/site
        run: npm ci
      - name: Build and test NamibOne Docs
        working-directory: docs/site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run check
      - name: Stage documentation with the portal
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist/docs
          cp -R docs/site/dist/. dist/docs/
          printf '%s\n' 'Sitemap: https://namibone.com/docs/sitemap-index.xml' >> dist/robots.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
            docs/site/playwright-report/
            docs/site/test-results/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified portal
        id: deployment
        uses: actions/deploy-pages@v4
